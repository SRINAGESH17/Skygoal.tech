<!DOCTYPE html>
<html>

<head>
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="content" style="
           width: 40px;
           height: 40px;
           border: 4px solid #E5E7EB;

           border-radius: 9999px;
           animation: spin 1s linear infinite;
         ">
    </div>

    <script type="text/javascript">
        window.location.href = "/home.html";
    </script>
</body>

</html>
