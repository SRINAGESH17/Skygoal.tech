<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Enquiry | Connect with Us for Partnerships & Opportunities</title>
    <meta name="description"
        content="Looking to collaborate or learn more about our services? Submit your business enquiry today. Our team will get back to you promptly with the best solutions tailored to your needs.">

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/img/skygoal-Logo 2.png">

    <!-- style sheets -->
    <link rel="stylesheet" type="text/css" href="./assets/css/ml.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets//css/breadCrumb.css" />
    <link rel="stylesheet" href="./assets/css/businessEnquiry.css" />

    <!-- Owl Carousel -->

    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.0.0-beta.3/assets/owl.carousel.min.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.0.0-beta.3/assets/owl.theme.default.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.0.0-beta.3/owl.carousel.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.3.1.js"
        integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60=" crossorigin="anonymous">
        </script>
    <script>
        $(function () {
            $("#header").load("header.html");
            $("#footer").load("footer.html");
        });
    </script>

    <!-- Validation Script -->
    <script>
        // Bootstrap Validation
        (function () {
            'use strict'

            const forms = document.querySelectorAll('.needs-validation')

            Array.from(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>

</head>

<body style="overflow-x: hidden;">
    <!-- navbar  -->
    <div id="header"></div>
    <div class="breadCrumbMainContainer">
        <a class="under-line-breadCrumb" href="/home.html">
            <img alt="home-img" src="./assets/img/home-img.png" style="width: 20px; height: 20px;" />
            <span>Home</span>
        </a>
        <span style="color: darkgray">/</span>
        <p>Business Enquiry</p>
    </div>
    <div class="businessParentContainer">
        <h5 class="businessHeading">Business Enquiry</h5>
        <div class="businessAddressFormContainer">
            <div class="addressContainer">
                <div class="labelContent">
                    <label for="location" style="font-size: 20px; font-weight: 600;">India</label>
                    <address style="font-size: 14px;">
                        PLOT NO: 75, 1ST FLOOR, PVKR ELITE, <br /> LUMBINI AVENUE ENCLAVE,
                        Gachibowli,<br />K.V.Rangareddy, Seri Lingampally, <br /> Telangana, India, 500032.
                    </address>
                </div>

                <div class="labelContent">
                    <label for="location" style="font-size: 20px; font-weight: 600;">United states</label>
                    <address style="font-size: 14px;">
                        16192 Coastal Highway<br /> Lewes, DE 19958
                        <br />United States
                    </address>
                </div>

                <div class="labelContent">
                    <label for="location" style="font-size: 20px; font-weight: 600;">United Kingdom</label>
                    <address style="font-size: 14px;">
                        20-22 Wenlock Road London<br /> N1 7GU
                    </address>
                </div>

                <div class="labelContent">
                    <label for="email">Email Us at:</label>
                    <a style="text-decoration: none; color: white;"
                        href="mailto:info@skygoaltech.com">info@skygoaltech.com</a>
                </div>
            </div>
            <div class="container formContainer">
                <form class="needs-validation"
                    action="https://script.google.com/macros/s/AKfycbzzE9_ZnqpYqoPfvHPpyCtnIqA4qprU30UtoXqBsqeA7PG7KRrFOqpcUVUAxx6Yzafy/exec"
                    method="post">
                    <label for="inputsHeading" class="form-label fillDetailsHeading"
                        style="font-size: larger; font-weight: 500;">
                        Fill Your Details
                    </label>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <input type="text" placeholder="Name" name="name" class="form-control enquiryInputField"
                                required />
                        </div>
                        <div class="col-12 col-md-6">
                            <input type="email" placeholder="Email Address" name="email"
                                class="form-control enquiryInputField" required />
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <input type="number" placeholder="Mobile Number" name="mobile"
                                class="form-control enquiryInputField" required />
                        </div>
                        <div class="col-12 col-md-6">
                            <input type="text" placeholder="Designation" name="designation"
                                class="form-control enquiryInputField" required />
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <input type="text" placeholder="Company Name" name="company"
                                class="form-control enquiryInputField" required />
                        </div>
                        <div class="col-12 col-md-6">
                            <input type="text" placeholder="Your Business Objective" name="businessObjective"
                                class="form-control enquiryInputField" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <textarea placeholder="Message" name="message" class="form-control enquiryInputField" rows="5"
                            required></textarea>
                    </div>

                    <div class="enquiryBtnParentContainer">
                        <button type="submit" class="btn px-5 enquiryBtn">
                            Submit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
